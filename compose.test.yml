# Local PostgreSQL for running the integration test suite without Neon.
#
# Usage:
#   docker compose -f compose.test.yml up -d
#   cp tests/IntegrationTests/Api.IntegrationTests/appsettings.Testing.Local.example.json \
#      tests/IntegrationTests/Api.IntegrationTests/appsettings.Testing.Local.json
#   dotnet test
#   docker compose -f compose.test.yml down
#
# Data is ephemeral (no named volume): `down` discards it. Respawn resets the schema between
# fixtures anyway, so persistence is unnecessary for tests.
name: bills-test

services:
  postgres:
    # Pinned by tag + digest (ADR 20).
    image: postgres:16.16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
    container_name: bills-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bills_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bills_test"]
      interval: 5s
      timeout: 5s
      retries: 5
