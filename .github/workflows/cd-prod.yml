name: CD-PROD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  deploy:
    name: Deploy to Azure Web App (PROD)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore BillsBackend.slnx

      - name: Publish
        run: dotnet publish src/Api/Api.csproj -c Release -r linux-x64 --self-contained true -p:PublishReadyToRun=true -o '${{ github.workspace }}/bill-api'

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply database migrations
        run: dotnet ef database update --project src/Data/Data.csproj --configuration Release
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '${{ github.workspace }}/bill-api'