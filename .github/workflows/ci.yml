name: CI

# Pull requests run CI directly. The CD workflows call this workflow on pushes,
# then deploy only after its jobs succeed.

on:
  pull_request:
    branches: [develop, main]
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Integration tests run against a disposable PostgreSQL service container instead of
    # Neon: it runs inside the runner (no extra billing, no external secret) and removes
    # the network latency that made the Neon-backed suite slow.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bills_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bills_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore BillsBackend.slnx

      - name: Build
        run: dotnet build BillsBackend.slnx --configuration Release --no-restore

      - name: Run Domain.UnitTests
        run: dotnet test --project tests/UnitTests/Domain.UnitTests/Domain.UnitTests.csproj -c Release --coverage --coverage-output-format cobertura --coverage-output "$GITHUB_WORKSPACE/TestResults/Domain.Unit/coverage.cobertura.xml"

      - name: Run Application.UnitTests
        run: dotnet test --project tests/UnitTests/Application.UnitTests/Application.UnitTests.csproj -c Release --coverage --coverage-output-format cobertura --coverage-output "$GITHUB_WORKSPACE/TestResults/Application.Unit/coverage.cobertura.xml"

      - name: Run Api.UnitTests
        run: dotnet test --project tests/UnitTests/Api.UnitTests/Api.UnitTests.csproj -c Release --coverage --coverage-output-format cobertura --coverage-output "$GITHUB_WORKSPACE/TestResults/Api.Unit/coverage.cobertura.xml"

      - name: Run Data.UnitTests
        run: dotnet test --project tests/UnitTests/Data.UnitTests/Data.UnitTests.csproj -c Release --coverage --coverage-output-format cobertura --coverage-output "$GITHUB_WORKSPACE/TestResults/Data.Unit/coverage.cobertura.xml"
              
      - name: Run Api.IntegrationTests
        run: dotnet test --project tests/IntegrationTests/Api.IntegrationTests/Api.IntegrationTests.csproj -c Release --coverage --coverage-output-format cobertura --coverage-output "$GITHUB_WORKSPACE/TestResults/Api.Integration/coverage.cobertura.xml"
        env:
          ConnectionStrings__Neon: "Host=localhost;Port=5432;Database=bills_test;Username=postgres;Password=postgres"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Merge coverage reports
        run: |
          reportgenerator \
            -reports:"${{ github.workspace }}/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"${{ github.workspace }}/CoverageReport" \
            -reporttypes:"Cobertura;Html"
            
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ github.workspace }}/CoverageReport/Cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: CoverageReport/Cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ github.workspace }}/CoverageReport
